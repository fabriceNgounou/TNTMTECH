# Hôte virtuel TNTMTECH — le port provient de $PORT (injecté par Railway)
<VirtualHost *:${PORT}>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Interdit l'accès aux fichiers cachés (.env, .git, ...)
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Railway place un proxy devant le conteneur : on récupère l'IP réelle
    RemoteIPHeader X-Forwarded-For

    # Cache navigateur pour les assets statiques
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css "access plus 1 year"
        ExpiresByType application/javascript "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/webp "access plus 1 year"
        ExpiresByType font/woff2 "access plus 1 year"
    </IfModule>

    # Journaux vers la sortie standard, récupérés par Railway
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
    LogLevel warn
</VirtualHost>
